name: CI

# Validates the app on every push to main and every PR. Tests exercise the
# app's plain JavaScript modules and Python scripts directly; the only install
# is pytest.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Test
        run: npm test --if-present

      - name: Verify mobius package
        run: npm run verify:mobius --if-present
